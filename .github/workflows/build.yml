name: Build Ligat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: source apk/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: source apk
        run: npm ci

      - name: Export Android bundle
        working-directory: source apk
        run: npx expo export --platform android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('source apk/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Generate release keystore & Build APK + AAB
        working-directory: source apk
        run: |
          npx expo prebuild --platform android --clean
          cd android
          # Generate release keystore baru
          keytool -genkey -v -keystore app/ligat-release.keystore -alias ligat \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ligat2026 -keypass ligat2026 \
            -dname "CN=Ligat, OU=Development, O=Ligat, L=Jakarta, ST=Jakarta, C=ID"
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=app/ligat-release.keystore \
            -PRELEASE_STORE_PASSWORD=ligat2026 \
            -PRELEASE_KEY_ALIAS=ligat \
            -PRELEASE_KEY_PASSWORD=ligat2026
          ./gradlew bundleRelease \
            -PRELEASE_STORE_FILE=app/ligat-release.keystore \
            -PRELEASE_STORE_PASSWORD=ligat2026 \
            -PRELEASE_KEY_ALIAS=ligat \
            -PRELEASE_KEY_PASSWORD=ligat2026

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ligat-Production
          path: |
            source apk/android/app/build/outputs/apk/release/*.apk
            source apk/android/app/build/outputs/bundle/release/*.aab
