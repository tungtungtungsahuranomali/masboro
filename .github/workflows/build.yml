name: Build Ligat APK + AAB (Production)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (opsional, misal: 1.3.0)'
        type: string
        default: ''

env:
  KEYSTORE_PASSWORD: ligat2026
  KEY_ALIAS: ligat
  KEY_PASSWORD: ligat2026

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: source apk/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: source apk
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('source apk/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Prebuild Android project
        working-directory: source apk
        run: npx expo prebuild --platform android --clean

      - name: Setup keystore
        working-directory: source apk/android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/ligat-release.keystore
            echo "Using keystore from GitHub Secrets"
          else
            keytool -genkey -v -keystore app/ligat-release.keystore -alias ${{ env.KEY_ALIAS }} \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ${{ env.KEYSTORE_PASSWORD }} -keypass ${{ env.KEY_PASSWORD }} \
              -dname "CN=Ligat, OU=Development, O=Ligat, L=Jakarta, ST=Jakarta, C=ID"
            echo "Generated new keystore (valid 10000 days)"
          fi

      - name: Build APK + AAB (1 ABI)
        working-directory: source apk/android
        run: ./gradlew assembleRelease bundleRelease -PreactNativeArchitectures=arm64-v8a --no-configuration-cache

      - name: Sign AAB with release keystore
        working-directory: source apk/android
        run: |
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -1)
          echo "AAB: $AAB"
          zip -d "$AAB" "META-INF/ANDROIDD.*" 2>/dev/null || true
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore app/ligat-release.keystore \
            -storepass ${{ env.KEYSTORE_PASSWORD }} -keypass ${{ env.KEY_PASSWORD }} \
            "$AAB" ${{ env.KEY_ALIAS }}

      - name: Sign APK with release keystore
        working-directory: source apk/android
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          echo "APK: $APK"
          zip -d "$APK" "META-INF/ANDROIDD.*" 2>/dev/null || true
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore app/ligat-release.keystore \
            -storepass ${{ env.KEYSTORE_PASSWORD }} -keypass ${{ env.KEY_PASSWORD }} \
            "$APK" ${{ env.KEY_ALIAS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ligat-APK-${{ inputs.version && format('v{0}', inputs.version) || github.run_number }}
          path: source apk/android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Ligat-AAB-${{ inputs.version && format('v{0}', inputs.version) || github.run_number }}
          path: source apk/android/app/build/outputs/bundle/release/*.aab

      - name: Upload keystore (download & save for future builds)
        uses: actions/upload-artifact@v4
        with:
          name: ligat-release-keystore
          path: source apk/android/app/ligat-release.keystore
