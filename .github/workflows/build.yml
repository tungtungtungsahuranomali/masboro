name: Build Ligat APK + AAB (Production)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (opsional, misal: 1.3.0)'
        type: string
        default: ''

env:
  KEYSTORE_PASSWORD: ligat2026
  KEY_ALIAS: ligat
  KEY_PASSWORD: ligat2026

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: source apk/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: source apk
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('source apk/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Prebuild Android project
        working-directory: source apk
        run: npx expo prebuild --platform android --clean

      - name: Setup keystore
        working-directory: source apk/android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/ligat-release.keystore
            echo "Using keystore from GitHub Secrets"
          else
            keytool -genkey -v -keystore app/ligat-release.keystore -alias ${{ env.KEY_ALIAS }} \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ${{ env.KEYSTORE_PASSWORD }} -keypass ${{ env.KEY_PASSWORD }} \
              -dname "CN=Ligat, OU=Development, O=Ligat, L=Jakarta, ST=Jakarta, C=ID"
            echo "Generated new keystore (valid 10000 days)"
          fi

      - name: Build APK (unsigned)
        working-directory: source apk/android
        run: ANDROID_SDK_ROOT=/usr/local/lib/android/sdk ./gradlew assembleRelease

      - name: Build AAB (unsigned)
        working-directory: source apk/android
        run: ANDROID_SDK_ROOT=/usr/local/lib/android/sdk ./gradlew bundleRelease

      - name: Sign APK + AAB with release keystore
        working-directory: source apk/android
        run: |
          KS="app/ligat-release.keystore"
          
          # Find apksigner
          APKSIGNER=$(find /usr/local/lib/android/sdk -name apksigner 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then
            # Try ANDROID_HOME
            APKSIGNER=$(find $ANDROID_HOME -name apksigner 2>/dev/null | head -1)
          fi
          if [ -z "$APKSIGNER" ]; then
            # Try default Ubuntu location
            APKSIGNER=$(find / -name apksigner -type f 2>/dev/null | head -1)
          fi
          echo "apksigner: $APKSIGNER"
          
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found! Using jarsigner instead."
            JARSIGNER="jarsigner"
            APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
            AAB=$(find app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -1)
            [ -n "$APK" ] && $JARSIGNER -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KS" -storepass ${{ env.KEYSTORE_PASSWORD }} -keypass ${{ env.KEY_PASSWORD }} \
              "$APK" ${{ env.KEY_ALIAS }}
            [ -n "$AAB" ] && $JARSIGNER -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KS" -storepass ${{ env.KEYSTORE_PASSWORD }} -keypass ${{ env.KEY_PASSWORD }} \
              "$AAB" ${{ env.KEY_ALIAS }}
          else
            APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
            AAB=$(find app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -1)
            echo "APK found: $APK"
            echo "AAB found: $AAB"
            [ -n "$APK" ] && $APKSIGNER sign --min-sdk-version 24 --ks "$KS" --ks-pass pass:${{ env.KEYSTORE_PASSWORD }} \
              --ks-key-alias ${{ env.KEY_ALIAS }} --key-pass pass:${{ env.KEY_PASSWORD }} \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$APK" || echo "APK sign failed"
            [ -n "$AAB" ] && $APKSIGNER sign --min-sdk-version 24 --ks "$KS" --ks-pass pass:${{ env.KEYSTORE_PASSWORD }} \
              --ks-key-alias ${{ env.KEY_ALIAS }} --key-pass pass:${{ env.KEY_PASSWORD }} \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$AAB" || echo "AAB sign failed"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ligat-APK-${{ inputs.version && format('v{0}', inputs.version) || github.run_number }}
          path: source apk/android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Ligat-AAB-${{ inputs.version && format('v{0}', inputs.version) || github.run_number }}
          path: source apk/android/app/build/outputs/bundle/release/*.aab

      - name: Upload keystore (download & save for future builds)
        uses: actions/upload-artifact@v4
        with:
          name: ligat-release-keystore
          path: source apk/android/app/ligat-release.keystore
