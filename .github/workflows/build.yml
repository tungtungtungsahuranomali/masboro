name: Build Ligat APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: source apk/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: source apk
        run: npm ci

      - name: Export Android bundle
        working-directory: source apk
        run: npx expo export --platform android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('source apk/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Prebuild & Build APK + AAB
        working-directory: source apk
        run: |
          npx expo prebuild --platform android --clean
          cd android
          cp ../ligat-release.keystore app/ligat-release.keystore
          echo "storeFile=ligat-release.keystore" > keystore.properties
          echo "storePassword=ligat2026" >> keystore.properties
          echo "keyAlias=ligat" >> keystore.properties
          echo "keyPassword=ligat2026" >> keystore.properties
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ligat-Production
          path: |
            source apk/android/app/build/outputs/apk/release/*.apk
            source apk/android/app/build/outputs/bundle/release/*.aab
