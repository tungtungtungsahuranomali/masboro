name: Build APK

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Tipe Build'
        type: choice
        options:
          - debug
          - release
        default: 'debug'
      app-version:
        description: 'Label version (opsional, misal: 1.3.0-test)'
        type: string
        default: ''

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: source apk/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        working-directory: source apk
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('source apk/android/**/*.gradle*', 'source apk/android/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prebuild Android project
        working-directory: source apk
        run: npx expo prebuild --platform android --clean

      - name: Build ${{ inputs.build-type == 'release' && 'Release' || 'Debug' }} APK
        working-directory: source apk/android
        run: |
          if [ "${{ inputs.build-type }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ligat-${{ inputs.build-type == 'release' && 'Release' || 'Debug' }}-build-${{ github.run_number }}${{ inputs.app-version && format('-{0}', inputs.app-version) || '' }}
          path: source apk/android/app/build/outputs/apk/${{ inputs.build-type == 'release' && 'release' || 'debug' }}/*.apk
          if-no-files-found: error
