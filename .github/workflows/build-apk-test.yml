name: Build Android APK & AAB

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Tipe Build'
        type: choice
        options:
          - debug
          - release
        default: 'debug'
      app-version:
        description: 'Label version (opsional, misal: 1.0.0)'
        type: string
        default: ''

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: source apk/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        working-directory: source apk
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('source apk/android/**/*.gradle*', 'source apk/android/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Expo prebuild
        id: cache-prebuild
        uses: actions/cache@v4
        with:
          path: source apk/android
          key: expo-prebuild-v2-${{ runner.os }}-${{ hashFiles('source apk/package.json', 'source apk/app.json', 'source apk/package-lock.json') }}

      - name: Prebuild Android project (if cache miss)
        if: steps.cache-prebuild.outputs.cache-hit != 'true'
        working-directory: source apk
        run: npx expo prebuild --platform android --clean

      - name: Configure bundling for debug variant
        working-directory: source apk/android
        run: |
          python3 -c "with open('app/build.gradle') as f: c=f.read(); c=c.replace('react {','react {\n    debuggableVariants = []',1); open('app/build.gradle','w').write(c)"
          grep debuggable app/build.gradle

      - name: Configure release signing (if release build)
        if: inputs.build-type == 'release'
        working-directory: source apk/android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/ligat-release.keystore
            echo "Using keystore from GitHub Secrets"
          else
            echo "WARNING: No KEYSTORE_BASE64 secret set! AAB will use debug signing."
          fi
          cat >> gradle.properties << EOF

          # Release signing config
          RELEASE_STORE_FILE=ligat-release.keystore
          RELEASE_STORE_PASSWORD=ligat2026
          RELEASE_KEY_ALIAS=ligat
          RELEASE_KEY_PASSWORD=ligat2026
          EOF
          echo "Release signing configured"

      - name: Build ${{ inputs.build-type == 'release' && 'Release' || 'Debug' }} APK & AAB
        working-directory: source apk/android
        run: |
          if [ "${{ inputs.build-type }}" = "release" ]; then
            ./gradlew assembleRelease
            ./gradlew bundleRelease
          else
            ./gradlew assembleDebug
            ./gradlew bundleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ligat-${{ inputs.build-type == 'release' && 'Release' || 'Debug' }}-build-${{ github.run_number }}${{ inputs.app-version && format('-{0}', inputs.app-version) || '' }}
          path: source apk/android/app/build/outputs/apk/${{ inputs.build-type == 'release' && 'release' || 'debug' }}/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ligat-${{ inputs.build-type == 'release' && 'Release' || 'Debug' }}-AAB-build-${{ github.run_number }}${{ inputs.app-version && format('-{0}', inputs.app-version) || '' }}
          path: source apk/android/app/build/outputs/bundle/${{ inputs.build-type == 'release' && 'release' || 'debug' }}/*.aab
          if-no-files-found: warn

