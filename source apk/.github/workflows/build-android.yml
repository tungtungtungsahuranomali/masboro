name: Build Android APK & AAB

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Ligat Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --clean
        env:
          CI: true

      - name: Setup release signing (if keystore provided)
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          # Decode keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/ligat-release.keystore
          # Inject signing config into build.gradle after prebuild
          sed -i 's/storeFile file(.debug.keystore.)/storeFile file("debug.keystore")\n        }\n        release {\n            storeFile file("ligat-release.keystore")\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")/' android/app/build.gradle
          # Update release build type to use release signing
          sed -i 's/signingConfig signingConfigs.debug$/signingConfig signingConfigs.release/' android/app/build.gradle

      - name: Build AAB (Android App Bundle)
        run: cd android && ./gradlew bundleRelease
        env:
          CI: true
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build APK
        run: cd android && ./gradlew assembleRelease
        env:
          CI: true
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ligat-apk-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ligat-aab-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
